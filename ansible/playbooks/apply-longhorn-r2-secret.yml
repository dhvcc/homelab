---
- name: Apply encrypted Longhorn R2 credentials
  hosts: k8s_control_plane[0]
  become: true
  gather_facts: false

  vars:
    encrypted_secret_path: "{{ playbook_dir }}/../secrets/longhorn-r2-secret.json.age"
    age_identity_file: "{{ lookup('env', 'HOME') }}/.ssh/id_rsa"

  pre_tasks:
    - name: Check age identity
      ansible.builtin.stat:
        path: "{{ age_identity_file }}"
      delegate_to: localhost
      become: false
      register: age_identity

    - name: Require age identity
      ansible.builtin.assert:
        that:
          - age_identity.stat.exists
        fail_msg: "Missing age identity: {{ age_identity_file }}"
      delegate_to: localhost
      become: false

    - name: Decrypt Longhorn R2 secret
      ansible.builtin.command:
        argv:
          - age
          - --decrypt
          - --identity
          - "{{ age_identity_file }}"
          - "{{ encrypted_secret_path }}"
      delegate_to: localhost
      become: false
      register: decrypted_secret
      changed_when: false
      no_log: true

  tasks:
    - name: Apply Longhorn R2 secret
      ansible.builtin.command: k3s kubectl apply -f -
      args:
        stdin: "{{ decrypted_secret.stdout }}"
      register: secret_apply
      changed_when: "'created' in secret_apply.stdout or 'configured' in secret_apply.stdout"
      no_log: true

    - name: Verify Longhorn R2 secret
      ansible.builtin.command: >
        k3s kubectl -n longhorn-system get secret longhorn-r2-credentials
      changed_when: false
